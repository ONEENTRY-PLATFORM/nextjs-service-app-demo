name: E2E

# Manual-only: auto-triggers (push/pull_request) removed to avoid consuming
# GitHub Actions minutes. Run from the Actions tab via "Run workflow", or
# locally with `npm run test:e2e:prod`.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Node is pinned <22.15: Playwright 1.61 breaks on Node >=22.15 (registerHooks SafeSet).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Pixel 7 (mobile-chrome) project also uses the Chromium engine, so one install covers
      # both the chromium and mobile-chrome projects.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # test:e2e:prod builds and serves the compiled app (config forces PROD when CI is set).
      - name: Run e2e (chromium + mobile-chrome)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          CI: 'true'
          NEXT_PUBLIC_PROJECT_URL: ${{ secrets.NEXT_PUBLIC_PROJECT_URL }}
          NEXT_PUBLIC_APP_TOKEN: ${{ secrets.NEXT_PUBLIC_APP_TOKEN }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
